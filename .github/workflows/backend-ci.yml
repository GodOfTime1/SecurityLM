name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set to your backend subfolder if this is a frontend/backend monorepo.
  BACKEND_DIR: .
  APP_ENV: development
  MODEL_BACKEND: echo
  ADVISOR_BACKEND: echo

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_backend.py --output dist/backend-source.zip

  dependencies:
    name: Dependency advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.txt --strict

  container:
    name: Clean container build
    needs: [tests, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --tag hackathon-backend:ci .
