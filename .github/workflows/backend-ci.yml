name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level env IS available inside steps (just not in job-level
# `defaults.run.working-directory`, which is why the folders are hard-coded below).
env:
  APP_ENV: development
  MODEL_BACKEND: echo
  ADVISOR_BACKEND: echo
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backend-tests:
    name: Backend tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
        include:
          # Your local dev environment (Windows + Python 3.14)
          - os: windows-latest
            python-version: '3.14'
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      # Runs every Backend/tests/test_*.py (assistants, backend, chat, deployment,
      # model selector, presets, review fixes, security, security_v2, advisor infra, ...).
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_backend.py --output dist/backend-source.zip

  frontend-tests:
    name: Frontend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    env:
      # The frontend test imports app.main, so the backend must be importable.
      PYTHONPATH: ${{ github.workspace }}/Backend
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Backend/requirements.txt
            Frontend/requirements-frontend.txt
      - name: Verify frontend checkout
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          root = Path.cwd().resolve()
          expected = Path(os.environ["GITHUB_WORKSPACE"]) / "Frontend"
          if root != expected.resolve():
              raise SystemExit(f"Wrong frontend working directory: {root}")
          required = [
              "home.py", "api_client.py", "ui_common.py", "styles.css",
              "prompting.py", "conversation_memory.py", "action_ui.py",
              "constants.py", "session_cache.py", "document_service.py",
              "help_content.py", "configure_frontend.py",
              "requirements-frontend.txt", "assets/securitylm-logo.png",
              "pages/document_upload.py", "pages/help.py", "pages/model_settings.py",
              "tests/frontend_fixture.py", "tests/test_frontend.py",
              "tests/test_frontend_integration.py", "tests/test_prompting.py",
              "tests/test_conversation_memory.py",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(
                  "Frontend checkout is incomplete. Missing files: " + ", ".join(missing)
                  + ". Copy the complete frontend into the repository's Frontend/ folder."
              )
          print(f"Verified frontend files in {root}")
          PYCODE
      - run: python -m pip install -r ../Backend/requirements.txt -r requirements-frontend.txt
      - run: python -m pip check
      - name: Verify backend is available for integration tests
        run: python -c "from app.main import app; print('Backend import verified')"
      - name: Run frontend tests from the local tests directory
        # ./tests is intentional: bare 'tests' can resolve to Backend/tests
        # through PYTHONPATH when Frontend/tests is missing.
        run: python -m unittest discover -s ./tests -v

  dependencies:
    name: Dependency advisory audit (${{ matrix.folder }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: Backend
            requirements: Backend/requirements.txt
          - folder: Frontend
            requirements: Frontend/requirements-frontend.txt
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r ${{ matrix.requirements }} --strict

  container:
    name: Clean backend container build
    needs: [backend-tests, frontend-tests, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --tag hackathon-backend:ci Backend
