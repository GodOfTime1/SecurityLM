name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level env IS available inside steps (just not in job-level
# `defaults.run.working-directory`, which is why the folders are hard-coded below).
env:
  APP_ENV: development
  MODEL_BACKEND: echo
  ADVISOR_BACKEND: echo
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backend-tests:
    name: Backend tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
        include:
          # Your local dev environment (Windows + Python 3.14)
          - os: windows-latest
            python-version: '3.14'
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      # Runs every Backend/tests/test_*.py (assistants, backend, chat, deployment,
      # model selector, presets, review fixes, security, security_v2, advisor infra, ...).
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_backend.py --output dist/backend-source.zip

  frontend-tests:
    name: Frontend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    env:
      # The frontend test imports app.main, so the backend must be importable.
      PYTHONPATH: ${{ github.workspace }}/Backend
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Backend/requirements.txt
            Frontend/requirements-frontend.txt
      - run: python -m pip install -r ../Backend/requirements.txt -r requirements-frontend.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  dependencies:
    name: Dependency advisory audit (${{ matrix.folder }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: Backend
            requirements: Backend/requirements.txt
          - folder: Frontend
            requirements: Frontend/requirements-frontend.txt
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r ${{ matrix.requirements }} --strict

  container:
    name: Clean backend container build
    needs: [backend-tests, frontend-tests, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --tag hackathon-backend:ci Backend
